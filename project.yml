name: Codenotch
options:
  bundleIdPrefix: com.vinz
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "1.20.0"
    CURRENT_PROJECT_VERSION: "22"
    # Signed with a stable identity on purpose. The app reads Claude Code's
    # OAuth token out of the login keychain, and the keychain's ACL remembers
    # *which signed binary* was allowed. Ad-hoc or unsigned builds get a new
    # identity on every rebuild, so "Always Allow" would be forgotten each time
    # and the prompt would come back after every `make run`.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6WFPL8B9FB
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          # Notes for whoever next re-generates the vendored decoder. Left in the
          # navigator beside the code it describes, but Xcode would otherwise
          # copy any unrecognised file into the app bundle's Resources, and a
          # developer README has no business shipping to users.
          - "Vendor/**/README.md"
    dependencies:
      - package: Sparkle
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Gauge
        CFBundleDisplayName: Gauge
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - de
          - id
          - ja
          - ko
          - pt-BR
          - ru
          - zh-Hans
          - zh-Hant
          - uk
          - uz
          - tr
        LSMinimumSystemVersion: "13.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Gauge answers your phone on this network so it can show your usage."
        # --- Sparkle -------------------------------------------------------
        # Auto-update is deliberately DISABLED on the Ventura (macOS 13) fork.
        # The official feed at hivinz.com only serves macOS 15 builds, so a
        # check here would offer this 13-compatible copy an update it cannot
        # run ("this software needs to be updated"). With no SUFeedURL there is
        # no feed, so nothing is ever offered; `Updater.start()` catches the
        # resulting error and simply does no checks. To re-enable updates
        # against a feed you control, restore SUFeedURL (and a matching
        # SUPublicEDKey) and set SUEnableAutomaticChecks back to true.
        #
        # SUFeedURL: (intentionally omitted — see above)
        # The public half of the EdDSA key. Harmless with no feed; kept so
        # restoring SUFeedURL is the only change needed to turn updates back on.
        SUPublicEDKey: rmUfT5r49nR+3HdkbR5/YYLghfnAi6L49eOk3sIegSk=
        # No automatic checks: without a feed they would only ever fail.
        SUEnableAutomaticChecks: false
        # Never downloads unasked: a new version is offered in the notch and
        # installed when Update is chosen — see `Updater`.
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinz.codenotch
        # The user-facing product is "Gauge" (fork), so the built bundle is
        # Gauge.app and the process is "Gauge". The target, scheme and bundle id
        # stay "Codenotch"/com.vinz.codenotch on purpose: CI (`make dmg-ci`),
        # the login-keychain ACL and the stored preferences all key off those,
        # so renaming only the product keeps settings and builds intact.
        PRODUCT_NAME: Gauge
        # Keeps the Swift module name as "Codenotch" even though PRODUCT_NAME
        # is "Gauge" — every test file imports `@testable import Codenotch`,
        # and without this pin the module would silently rename to Gauge and
        # 70+ tests would fail to compile.
        PRODUCT_MODULE_NAME: Codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en
        # The only C in the project is the vendored Zstandard decoder, and this
        # is how Swift sees it. It is needed because Claude Desktop's HTTP cache
        # stores bodies with `content-encoding: zstd` and macOS ships no zstd
        # anywhere a signed, notarized app can reach — see
        # Sources/Vendor/zstd/README.md. Delete this line and that directory
        # together if the Desktop source is ever dropped.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Codenotch-Bridging-Header.h

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinz.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Hosted test bundle. The host product is named Gauge, not
        # Codenotch — the target is Codenotch but PRODUCT_NAME is Gauge,
        # so the built app bundle is Gauge.app and the executable inside
        # is Gauge. Pointing TEST_HOST at Codenotch.app made xcodebuild's
        # pre-flight for `build-for-testing` fail with "Could not find
        # test host" every time on macos-26 runners.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Gauge.app/Contents/MacOS/Gauge
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
