name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: github.repository == 'vinzdg/codenotch' || github.repository == 'lucaslr69/gauge'
    name: Unit tests
    # macOS 26, because that is what the app targets. An older image ships an
    # Xcode that cannot read the project at all — `objectVersion 77` is a
    # format it does not know — long before it gets as far as the macOS 26
    # deployment target or the Liquid Glass APIs the settings panel uses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Printed rather than assumed: when this job fails on a runner image
      # change, the toolchain is the first thing worth seeing.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check local signing detection
        run: bash Scripts/test-signing.sh

      # Builds first with a result bundle, and on failure asks xcresulttool
      # to print the diagnostics — xcodebuild on its own collapses a failed
      # build into "Could not find test host" and leaves the real reason in
      # the bundle only.
      - name: Build for testing
        run: |
          set -o pipefail
          make gen
          rm -rf /tmp/build.xcresult
          xcodebuild \
            -project Codenotch.xcodeproj \
            -scheme Codenotch \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -resultBundlePath /tmp/build.xcresult \
            build-for-testing \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            || { \
              echo "--- xcresult diagnostics ---"; \
              xcrun xcresulttool get build-results \
                --path /tmp/build.xcresult \
                --format json 2>/dev/null \
                | python3 -c 'import json,sys; r=json.load(sys.stdin); \
                              [print(i.get("issueType","?"), "-", i.get("message","")) for i in r.get("issues",{}).get("errors",[])]; \
                              [print("warn:", i.get("message","")) for i in r.get("issues",{}).get("warnings",[])[:10]]' \
                || xcrun xcresulttool get --path /tmp/build.xcresult --format json | head -200; \
              exit 1; \
            }

      # Unsigned on purpose: no identity exists on a runner, and the tests
      # read fixtures rather than keychains — see `make test-ci`.
      - name: Run unit tests
        run: make test-ci

      - name: Verify SwiftPM resolution
        run: make verify-deps
